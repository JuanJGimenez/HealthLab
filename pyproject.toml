[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misalud"
version = "0.10.0"
description = "Local desktop app that accumulates and analyses Samsung Health exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "reportlab>=4.0",
]

[project.scripts]
misalud = "misalud.interface.window:main"

[project.optional-dependencies]
ui = ["pywebview>=6.0"]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "pypdf>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
misalud = [
    "py.typed",
    "reading/contracts.json",
    "interface/locales/*.json",
    "reports/locales/*.json",
    "interface/web/*",
    "interface/web/vendor/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, N: naming, D: docstrings,
# UP: modern syntax, B: likely bugs, SIM: simplifications, PTH: pathlib, RUF: ruff rules.
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "PTH", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are documented by their names; module docstrings stay mandatory.
"tests/**" = ["D103"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["webview", "playwright.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --cov=misalud --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/__main__.py"]
